name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ebitengine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev
      - run: make vet
      - run: make test
      - name: Check the game's balance
        run: go run ./tools/balance -runs 100 -floors 9
      - name: Build all platforms
        run: make build-linux build-mac build-windows build-web
      - uses: actions/upload-artifact@v4
        with:
          name: halpwords-builds
          path: |
            dist/linux-amd64
            dist/mac-arm64
            dist/windows-amd64
            dist/web

  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make bundle-mac
      - uses: actions/upload-artifact@v4
        with:
          name: Halpwords-mac
          path: dist/Halpwords.app

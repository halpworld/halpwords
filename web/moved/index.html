<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Halpwords has moved</title>
<meta name="description" content="Halpwords now lives at play.halpwords.com.">
<meta name="theme-color" content="#0d0a14">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="canonical" href="https://play.halpwords.com/">
<style>
  :root { color-scheme: dark; --bg: #0d0a14; --ink: #e8dcc0; --dim: #8a7f96; --gold: #ffd640; --frame: #c9a26b; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  main { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 16px; text-align: center; }
  h1 { margin: 0; font-size: 32px; letter-spacing: 4px; color: var(--gold); text-shadow: 3px 3px 0 #5c2a1a; }
  p { margin: 0; max-width: 32em; }
  a { color: var(--gold); }
  #status { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>HALPWORDS HAS MOVED</h1>
  <p>The game now lives at <a id="go" href="https://play.halpwords.com/">play.halpwords.com</a>.</p>
  <p id="status">Taking your hero, your words and your Hall of Fame with you…</p>
  <noscript><p>Your progress can only come along with JavaScript on. Follow the link above to play.</p></noscript>
</main>
<script src="moved.js"></script>
</body>
</html>
